quarkus.log.level=INFO
quarkus.log.category."org.acme".level=DEBUG

# MCP communicates over stdout; disable console logs to avoid polluting JSON-RPC
quarkus.log.console.enable=false

# File log for debugging (root dir controlled by DATA_DIR, override file via QUARKUS_LOG_FILE_PATH)
quarkus.log.file.enable=true
quarkus.log.file.path=${QUARKUS_LOG_FILE_PATH:${DATA_DIR:${user.home}/.javatool-mcp}/mcp.log}
quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%n

custom.commands.path=${MCP_COMMANDS_PATH:${DATA_DIR:${user.home}/.javatool-mcp}/commands.yaml}
jdbc.storage.path=${JDBC_STORAGE_PATH:${DATA_DIR:${user.home}/.javatool-mcp}/connections.yaml}
jdbc.pool.max-active=${JDBC_POOL_MAX_ACTIVE:10}
jdbc.pool.max-wait=${JDBC_POOL_MAX_WAIT:30000}
jdbc.pool.initial-size=${JDBC_POOL_INITIAL_SIZE:1}
jdbc.pool.min-idle=${JDBC_POOL_MIN_IDLE:1}
jdbc.pool.login-timeout=${JDBC_POOL_LOGIN_TIMEOUT:5}
jdbc.pool.connect-timeout=${JDBC_POOL_CONNECT_TIMEOUT:5000}
jdbc.pool.socket-timeout=${JDBC_POOL_SOCKET_TIMEOUT:1800000}
jdbc.query.default-timeout=${JDBC_QUERY_DEFAULT_TIMEOUT:180}
jdbc.query.max-timeout=${JDBC_QUERY_MAX_TIMEOUT:1800}

quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false

# ===== Web 控制台 =====
# HTTP 端口独立于 MCP stdio，不占用标准输入输出，不影响 MCP 协议
quarkus.http.port=${CONSOLE_PORT:8080}
quarkus.http.host=${CONSOLE_HOST:0.0.0.0}
# 控制台访问令牌（Bearer）。未设置时控制台 API 返回 503 禁用，前端提示需配置
console.token=${CONSOLE_TOKEN:}
# 控制台开关：false 时即使有 token 也拒绝所有 /api
console.enabled=${CONSOLE_ENABLED:true}
